application:
  name: Omega
  version: 0.1.0
  environment: development

user:
  display_name: Anshuman

assistant:
  activation_phrase: Hello Omega
  shutdown_phrase: Shut down Omega
  active_session_timeout_seconds: 300

logging:
  level: INFO
  console_enabled: true
  file_enabled: true
  max_file_size_mb: 5
  backup_count: 3

database:
  enabled: true
  filename: omega.db
  busy_timeout_ms: 5000
  journal_mode: WAL
  synchronous: NORMAL
  foreign_keys: true

safety:
  allow_administrator_operations: false
  allow_arbitrary_shell_commands: false
  permanent_deletion_enabled: false
  default_decision: deny
  confirmation_timeout_seconds: 30
  maximum_confirmation_attempts: 3
  allow_force_close: false
  allow_absolute_paths: false
  allow_network_paths: false
  allow_device_paths: false
  allow_destination_replace: false
  allow_folder_merge: false
  allow_cross_volume_destructive_move: false

applications:
  launch_verification_timeout_seconds: 5
  graceful_close_timeout_seconds: 5
  force_close_timeout_seconds: 3
  allow_force_close: false

files:
  default_location: desktop
  maximum_read_size_bytes: 1048576
  maximum_display_characters: 10000
  maximum_write_size_bytes: 1048576
  maximum_resulting_file_size_bytes: 5242880
  search_max_depth: 5
  search_max_results: 50
  allow_absolute_paths: false
  allow_permanent_deletion: false

folders:
  default_location: desktop
  maximum_listing_items: 100
  maximum_scan_depth: 10
  maximum_scan_items: 10000
  maximum_scan_bytes: 10737418240
  maximum_copy_depth: 20
  maximum_copy_items: 10000
  maximum_copy_bytes: 5368709120
  search_max_depth: 6
  search_max_results: 50
  allow_folder_merge: false
  allow_destination_replace: false
  allow_permanent_deletion: false
  allow_cross_volume_move: false

recovery:
  enabled: true
  allow_permanent_deletion: false
  require_confirmation_for_recycle: true
  require_confirmation_for_restore: true
  undo_timeout_seconds: 300
  maximum_undo_records: 20
  maximum_recycle_size_bytes: 5368709120
  persist_undo_records: true

history:
  enabled: true
  persistence_enabled: true
  default_limit: 20
  maximum_limit: 100
  maximum_export_bytes: 1048576
  preserve_active_undo_records: true

voice:
  enabled: true
  offline_recognition_enabled: true
  model_path: vosk-model-small-en-us-0.15
  microphone_device: null
  sample_rate_hz: 16000
  audio_block_size: 4000
  passive_listening_timeout_seconds: 1
  active_listening_timeout_seconds: 10
  active_session_timeout_seconds: 300
  maximum_transcript_characters: 1000
  minimum_confidence: 0.50
  speak_responses: true
  speech_rate: 180
  speech_volume: 1.0
  voice_name: null
  confirmation_confidence_threshold: 0.85
  return_to_passive_after_session: true

browser:
  enabled: true
  preferred_browser: edge
  automation_enabled: true
  allowed_schemes:
    - https
  allow_http: false
  allow_file_urls: false
  allow_localhost: false
  allow_private_networks: false
  allow_url_credentials: false
  allow_javascript_urls: false
  allow_data_urls: false
  allow_downloads: false
  allow_form_submission: false
  allow_sensitive_input: false
  allow_private_mode: false
  navigation_timeout_seconds: 20
  operation_timeout_seconds: 10
  maximum_open_tabs: 10
  maximum_url_characters: 2048
  maximum_page_title_characters: 300
  maximum_page_text_characters: 10000
  maximum_search_query_characters: 500
  maximum_bookmark_name_characters: 100
  default_search_engine: duckduckgo

system:
  enabled: true
  information_enabled: true
  audio_control_enabled: true
  brightness_control_enabled: true
  process_listing_enabled: true
  process_termination_enabled: false
  settings_pages_enabled: true
  power_actions_enabled: true
  lock_enabled: true
  shutdown_enabled: true
  restart_enabled: true
  sign_out_enabled: true
  sleep_enabled: true
  hibernate_enabled: false
  maximum_process_results: 50
  maximum_disk_results: 20
  maximum_network_results: 20
  minimum_volume_percent: 0
  maximum_volume_percent: 100
  minimum_brightness_percent: 10
  maximum_brightness_percent: 100
  maximum_control_increment_percent: 25
  power_confirmation_timeout_seconds: 30
  power_countdown_seconds: 10
  allow_cancel_power_countdown: true

scheduling:
  enabled: true
  timezone: system
  scheduler_poll_interval_seconds: 1
  claim_timeout_seconds: 300
  maximum_delivery_batch: 50
  maximum_active_items: 500
  maximum_title_characters: 120
  maximum_message_characters: 1000
  maximum_timer_duration_seconds: 604800
  maximum_alarm_horizon_days: 3650
  maximum_recurring_occurrences: 1000
  maximum_snooze_minutes: 1440
  default_snooze_minutes: 10
  deliver_overdue_items: true
  maximum_overdue_age_seconds: 86400
  speak_notifications: false
  restore_pending_items_on_startup: true
  allow_scheduled_commands: false
  allow_recurring_scheduled_commands: false

productivity:
  enabled: true
  maximum_notes: 5000
  maximum_task_lists: 200
  maximum_tasks: 10000
  maximum_note_title_characters: 200
  maximum_note_body_characters: 50000
  maximum_task_title_characters: 300
  maximum_task_description_characters: 5000
  maximum_tags_per_item: 20
  maximum_tag_characters: 50
  maximum_search_query_characters: 500
  maximum_search_results: 200
  maximum_export_bytes: 10485760
  allow_markdown_export: true
  allow_json_export: true
  allow_json_import: true
  allow_markdown_import: false
  preserve_archived_items: true
  reminder_linking_enabled: true
  automatically_create_deadline_reminders: false

knowledge:
  enabled: true
  supported_extensions:
    - .pdf
    - .docx
    - .txt
    - .md
    - .markdown
  maximum_file_bytes: 26214400
  maximum_files_per_request: 100
  maximum_total_bytes_per_request: 104857600
  maximum_document_characters: 2000000
  maximum_documents: 5000
  maximum_collections: 200
  maximum_collection_name_characters: 120
  maximum_document_title_characters: 300
  maximum_pages: 2000
  chunk_size_characters: 1500
  chunk_overlap_characters: 200
  maximum_chunks_per_document: 5000
  default_search_limit: 10
  maximum_search_limit: 100
  maximum_query_characters: 1000
  maximum_excerpt_characters: 320
  recursive_directory_indexing_default: false
  ignored_directory_names:
    - .git
    - .mypy_cache
    - .pytest_cache
    - .ruff_cache
    - .venv
    - __pycache__
    - data
    - models
    - node_modules
  keyword_search_enabled: true
  semantic_search_enabled: false
  semantic_model_name: null
  semantic_model_path: null
  semantic_vector_dimension: null
  minimum_semantic_score: 0.25
  answer_maximum_context_characters: 20000
  extraction_timeout_seconds: 30
  indexing_worker_count: 2
  allow_duplicate_content: false
  preserve_original_files: true
  copy_documents_into_data_directory: false
  auto_reindex_changed_documents: false

# Phase 18 email assistance is provider-independent and disabled by default.
# Credentials are never stored here. The bundled fake provider is only for
# automated tests and explicitly configured local demonstrations.
email:
  enabled: false
  provider: null
  account_name: null
  maximum_messages_per_request: 20
  maximum_search_query_characters: 300
  maximum_body_characters: 20000
  maximum_summary_characters: 1500
  maximum_recipients: 10
  maximum_subject_characters: 300
  maximum_draft_body_characters: 50000
  provider_timeout_seconds: 20
  allow_attachment_downloads: false
  maximum_attachment_bytes: 10485760
  require_confirmation_for_send: true
  require_confirmation_for_archive: true

# Phase 19 calendar assistance is provider-independent and disabled by default.
# No credentials or event bodies are persisted by Omega's calendar receipts.
calendar:
  enabled: false
  provider: null
  account_name: null
  timezone_name: Asia/Calcutta
  maximum_events_per_request: 50
  maximum_search_query_characters: 300
  maximum_date_range_days: 366
  maximum_title_characters: 300
  maximum_description_characters: 10000
  maximum_location_characters: 500
  maximum_attendees: 50
  maximum_recurrence_occurrences: 500
  default_event_duration_minutes: 60
  minimum_event_duration_minutes: 5
  maximum_event_duration_hours: 24
  working_day_start: "09:00"
  working_day_end: "18:00"
  minimum_free_slot_minutes: 30
  maximum_reminders: 5
  maximum_reminder_lead_days: 30
  provider_timeout_seconds: 20
  require_confirmation_for_create: true
  require_confirmation_for_update: true
  require_confirmation_for_delete: true
  require_confirmation_for_invitation_response: true

# Phase 20 desktop utilities are explicit, local, bounded, and never monitored.
desktop_utilities:
  enabled: true
  clipboard_enabled: true
  screenshots_enabled: true
  screen_information_enabled: true
  window_information_enabled: true
  clipboard_history_enabled: false
  maximum_clipboard_characters: 50000
  maximum_clipboard_display_characters: 5000
  maximum_window_results: 25
  maximum_window_title_characters: 300
  screenshot_format: png
  screenshot_directory: null
  maximum_screenshot_width: 16384
  maximum_screenshot_height: 16384
  maximum_screenshot_pixels: 67108864
  maximum_recent_screenshots: 50
  allow_full_virtual_desktop_capture: true
  allow_region_capture: true
  require_confirmation_for_clear_clipboard: true
  require_confirmation_for_delete_screenshot: true
  allow_background_clipboard_monitoring: false
  allow_background_screenshot_capture: false

workflows:
  enabled: true
  maximum_workflows: 100
  maximum_steps_per_workflow: 50
  maximum_workflow_name_characters: 120
  maximum_description_characters: 1000
  maximum_serialized_definition_bytes: 262144
  maximum_execution_seconds: 1800
  maximum_step_seconds: 300
  maximum_delay_seconds: 3600
  maximum_retries: 2
  maximum_condition_depth: 4
  maximum_variable_characters: 10000
  maximum_result_characters: 20000
  maximum_history_results: 50
  maximum_concurrent_runs: 1
  allow_scheduled_workflows: true
  allow_destructive_steps: false
  allow_external_side_effect_steps: true
  require_confirmation_before_run: true
  require_confirmation_for_sensitive_steps: true
  imported_workflows_enabled_by_default: false
  stop_on_failure_by_default: true
  allow_background_triggers: false
  allow_shell_steps: false
  allow_code_execution_steps: false
  allow_network_request_steps: false

# Phase 22 plugins are local, explicitly reviewed, and disabled until approved.
plugins:
  enabled: true
  load_builtin_plugins: true
  load_user_plugins: false
  user_plugin_directory: null
  development_plugin_directory: null
  allow_development_plugins: false
  maximum_plugins: 50
  maximum_manifest_bytes: 65536
  maximum_package_bytes: 52428800
  maximum_package_files: 1000
  maximum_plugin_storage_bytes: 10485760
  maximum_plugin_configuration_bytes: 262144
  plugin_call_timeout_seconds: 30
  plugin_shutdown_timeout_seconds: 10
  require_confirmation_for_install: true
  require_confirmation_for_enable: true
  require_confirmation_for_permission_grant: true
  require_confirmation_for_remove: true
  newly_installed_plugins_enabled: false
  automatically_update_plugins: false
  allow_remote_plugin_downloads: false
  allow_shell_permissions: false
  allow_arbitrary_network_permissions: false
  allow_credential_permissions: false
  allow_safety_bypass_permissions: false

# Phase 23 local AI is optional, local-only, bounded, and disabled by default.
# Models and dependencies are never downloaded automatically.
local_ai:
  enabled: false
  provider: null
  default_generation_model: null
  default_embedding_model: null
  approved_model_directory: null
  automatically_download_models: false
  allow_remote_endpoints: false
  allow_only_loopback_endpoints: true
  endpoint: null
  maximum_prompt_characters: 50000
  maximum_response_characters: 10000
  maximum_context_turns: 10
  maximum_context_characters: 30000
  maximum_grounding_chunks: 10
  maximum_grounding_characters: 30000
  maximum_concurrent_requests: 1
  maximum_queued_requests: 5
  generation_timeout_seconds: 120
  model_load_timeout_seconds: 180
  idle_unload_seconds: 600
  unload_model_when_idle: true
  enable_grounded_answers: true
  enable_email_assistance: true
  enable_calendar_assistance: true
  enable_note_assistance: true
  enable_workflow_suggestions: true
  enable_ai_command_fallback: false
  enable_conversation_persistence: false
  require_confirmation_before_applying_generated_changes: true
  expose_model_debug_output: false
  log_prompts: false
  log_responses: false
