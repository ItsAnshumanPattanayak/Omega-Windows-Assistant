name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and commit
    runs-on: windows-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify tag, version, and main ancestry
        shell: pwsh
        run: |
          python -m omega.distribution.release validate-version --repository-root . --tag $env:GITHUB_REF_NAME
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag commit is not in origin/main history." }
      - name: Run release security checks
        run: |
          python -m pytest -p no:cacheprovider tests/security tests/safety tests/ci
          python -m omega --security-check

  build:
    name: Build verified Windows artifacts
    needs: validate
    uses: ./.github/workflows/windows-build.yml
    permissions:
      contents: read

  publish:
    name: Publish verified GitHub release
    needs: [validate, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify checksums before publication
        shell: pwsh
        run: |
          $Lines = Get-Content release-artifacts/SHA256SUMS.txt
          foreach ($Line in $Lines) {
            if ($Line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)$') { throw "Invalid checksum entry." }
            $Actual = (Get-FileHash -Algorithm SHA256 (Join-Path release-artifacts $Matches[2])).Hash.ToLowerInvariant()
            if ($Actual -ne $Matches[1]) { throw "Checksum mismatch for $($Matches[2])." }
          }
      - name: Create GitHub release from existing tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Files = (Get-ChildItem release-artifacts -File).FullName
          $Arguments = @("release", "create", $env:GITHUB_REF_NAME) + $Files + @("--verify-tag", "--generate-notes", "--title", "Omega $env:GITHUB_REF_NAME")
          if ($env:GITHUB_REF_NAME -match '-') { $Arguments += "--prerelease" }
          & gh @Arguments
