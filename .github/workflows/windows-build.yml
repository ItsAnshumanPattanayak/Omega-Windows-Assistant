name: Windows package build

on:
  workflow_call:
    inputs:
      build_installer:
        required: false
        default: true
        type: boolean
      extended_verification:
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the installer when trusted Inno Setup is present
        required: true
        default: true
        type: boolean
      extended_verification:
        description: Run the complete test suite before packaging
        required: true
        default: true
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Verified Windows x64 package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up packaging Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
      - name: Validate version and optional tag
        shell: pwsh
        run: |
          $Arguments = @("-m", "omega.distribution.release", "validate-version", "--repository-root", ".")
          if ($env:GITHUB_REF -like "refs/tags/*") { $Arguments += @("--tag", $env:GITHUB_REF_NAME) }
          & python @Arguments
      - name: Check quality
        run: |
          python -m black --check .
          python -m ruff check .
          python -m mypy src
      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || inputs.extended_verification
        run: python -m pytest -p no:cacheprovider
      - name: Run packaging tests
        if: github.event_name == 'workflow_dispatch' && !inputs.extended_verification
        run: python -m pytest -p no:cacheprovider tests/distribution tests/ci
      - name: Build and verify one-folder bundle
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python -SkipChecks
      - name: Build installer when available
        shell: pwsh
        run: |
          $Requested = $env:GITHUB_EVENT_NAME -ne "workflow_dispatch" -or "${{ inputs.build_installer }}" -eq "true"
          $Compiler = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($Requested -and $Compiler) {
            ./scripts/build_installer.ps1 -Python python -InnoCompiler $Compiler.Source
          } else {
            "Installer not built: trusted Inno Setup is unavailable or the bounded input disabled it." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Assemble distributable artifacts
        shell: pwsh
        run: |
          $Version = python -c "from omega import APP_VERSION; print(APP_VERSION)"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/Omega/* -DestinationPath "artifacts/Omega-$Version-windows-x64.zip"
          Get-ChildItem installer/output/Omega-Setup-*.exe -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts
          python -m omega.distribution.release create-metadata --repository-root . --output artifacts/build-metadata.json
          python -m omega.distribution.release create-checksums --directory artifacts --output artifacts/SHA256SUMS.txt
      - name: Verify final artifact set
        run: python -m omega.distribution.release verify-artifacts --directory artifacts
      - name: Upload verified package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: omega-${{ github.ref_name }}-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
